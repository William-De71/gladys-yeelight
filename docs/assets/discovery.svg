<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How the Yeelight lights are discovered</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="470" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Source 1: network scan -->
  <rect x="30" y="30" width="390" height="200" rx="10" fill="#eef6ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="50" y="58" font-size="15" font-weight="600" fill="#0a3069">1. Network scan</text>
  <text x="50" y="82" font-size="12" fill="#24292f">The integration writes the M-SEARCH, Gladys broadcasts</text>
  <text x="50" y="100" font-size="12" fill="#24292f">it on UDP 1982 (not 1900: this is not standard SSDP).</text>
  <rect x="50" y="114" width="350" height="100" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="62" y="134" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#57606a">HTTP/1.1 200 OK</text>
  <text x="62" y="152" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#24292f">id: 0x000000000015243f   ← factory id</text>
  <text x="62" y="170" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#24292f">model: ceiling10</text>
  <text x="62" y="188" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#24292f">support: set_power set_rgb bg_set_power…</text>
  <text x="62" y="206" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#24292f">power: on  bright: 80  ct: 4000 …</text>

  <!-- Source 2: lights added by hand -->
  <rect x="460" y="30" width="390" height="200" rx="10" fill="#fff8e6" stroke="#bf8700" stroke-width="1.5"/>
  <text x="480" y="58" font-size="15" font-weight="600" fill="#6b4600">2. Lights added by hand</text>
  <text x="480" y="82" font-size="12" fill="#24292f">For a light on another subnet or VLAN, which no</text>
  <text x="480" y="100" font-size="12" fill="#24292f">broadcast can reach. Probed over TCP 55443:</text>
  <text x="480" y="128" font-size="12" fill="#24292f">• its properties tell its capabilities and its model;</text>
  <text x="480" y="148" font-size="12" fill="#24292f">• the factory id cannot be read that way, so the</text>
  <text x="492" y="166" font-size="12" fill="#24292f">light is named after its address (manual-…) —</text>
  <text x="492" y="184" font-size="12" fill="#24292f">give it a fixed IP in your router;</text>
  <text x="480" y="208" font-size="12" fill="#24292f">• skipped when the scan already found that address.</text>

  <!-- Merge -->
  <path d="M 225 232 L 400 292" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 655 232 L 480 292" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="250" y="295" width="380" height="60" rx="10" fill="#f6f8fa" stroke="#24292f" stroke-width="1.5"/>
  <text x="440" y="321" text-anchor="middle" font-size="14" font-weight="600" fill="#24292f">One device per light, keyed on its id</text>
  <text x="440" y="341" text-anchor="middle" font-size="12" fill="#57606a">the IP address is a device param, never part of the id</text>

  <!-- Result -->
  <path d="M 440 357 L 440 387" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="150" y="390" width="580" height="54" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="440" y="413" text-anchor="middle" font-size="14" font-weight="600" fill="#116329">Discover screen: lights ready to add, with their real state</text>
  <text x="440" y="432" text-anchor="middle" font-size="12" fill="#24292f">features follow the support list each light announces — no model table to wait for</text>
</svg>
