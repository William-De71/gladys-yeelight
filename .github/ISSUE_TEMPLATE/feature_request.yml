name: Feature request
description: Something the integration could do for you.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you would like to do
      description: The use case first (a scene, a dashboard, a sensor…), then the idea. Name the light model concerned if there is one.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Gladys and integration versions, light model
      placeholder: 'Gladys 5.1.4, integration 1.3.0, color4'
